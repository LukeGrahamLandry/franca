<!doctype html>
<html style="height: 100%">
    <head>
        <link rel="canonical" href="https://franca.lukegrahamlandry.ca">
        <title>Franca Playground</title>
        <style>
            html {
                color-scheme: dark;
            }
            body {
                height: 100%; 
                overflow: hidden;
            }
            .have_pipe {
                width: 49%;
                height: 100%;
                display: inline-block;
            }
            .pipe {
                width: 100%;
                height: 100%;
                outline: none;
                border: none;
                font-family: monospace;
                white-space: pre;
                resize: none;
            }
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: 10%;
                text-align: center;
                overflow-y: auto;
            }
    
            #text {
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                height: 100%;
                width: 90%;
            }
            
            canvas:focus {
                outline: none;
            }
            canvas {
                border: none;
                display: none;
            }
            summary {
                text-align: left;
                padding-left: 5px;
            }
        </style>
    </head>
    <body>
        <div id="sidebar">
            <details open><summary>Program</summary>
            <a href="https://git.sr.ht/~lukegrahamlandry/franca">sr.ht</a><br/>
            <a href="https://github.com/LukeGrahamLandry/franca">github</a><br/>
            <div id="time" style="font-size: 0.5rem;">Downloading programs...</div>
            <button id="btn">loading</button><br/><br/>
            <select id="compiler" style="width: 90%;"></select><br/><br/>
            <select id="example" style="width: 90%;"></select><br/>
            <details><summary>Extra</summary>
                <select id="target" style="width: 90%;"></select><br/>
                <input id="dbg" type="text" style="width: 90%; font-size: 0.7rem;" placeholder="PMNCFAILSRpDGBtda">
                <button id="all">Test All</button>
                <br><button onclick="navigator.clipboard.writeText(document.getElementById('out').value);">Copy Output</button>
                <br><input type="checkbox" id="togglecanvas"> Enable Canvas
                <br><a href="/ls.html">files</a>
                <div>
                    <a style="font-size: 0.5rem;" id="repro.txt" rel="nofollow">repro.txt</a>
                    <a style="font-size: 0.5rem;" id="repro.png" rel="nofollow">repro.png</a>
                    <a style="font-size: 0.5rem;" href="/a.png"->gpu.png</a>
                </div>
                <b id="version" style="word-wrap: break-word;"></b>
            </details>
            <b id="stale" hidden style="color: red;"> OUTPUT IS STALE </b>
            <div style="font-size: 0.5rem;">
                disclaimer: wasm support is wip. 
                many of my example programs work on native targets but not web (or not in all browsers). 
                expect mysterious crashes here 
            </div>
            </details>
            
            <details><summary>Canvas</summary>
            <input type="checkbox" id="fullcanvas"> Big Canvas
            <br>
            <br><button id="hidebar">Hide Side Bar</button>
            <br><button id="fullscreen" disabled>Fullscreen</button>
            </details>
            <b id="err"></b>
        </div>
        <div id="text">
            <div class="have_pipe" id="in_box">
                <textarea class="pipe" id="in" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
            </div>
            <div class="have_pipe" id="out_box">
                <canvas id="canvas" tabIndex="1" style="height: 71%;"></canvas>
                <textarea class="pipe" id="out" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
            </div>
        </div>
        <script src="$$TARGET$$/main.js" type="module"></script>
    </body>
</html>
